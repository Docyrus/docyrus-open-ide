<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>File Explorer</title>
    <link rel="stylesheet" href="./tree.css" />
  </head>
  <body>
    <nav id="panel-tabs" role="tablist" aria-label="Explorer panels">
      <button id="tab-files" class="panel-tab" type="button" role="tab" aria-selected="true" aria-controls="panel-files">Files</button>
      <button id="tab-search" class="panel-tab" type="button" role="tab" aria-selected="false" aria-controls="panel-search">Search</button>
      <span class="tab-spacer"></span>
      <div id="files-actions">
        <button id="action-new-file" class="icon-button" type="button" title="New File" aria-label="New File">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 1.75H4.25a1.1 1.1 0 0 0-1.1 1.1v10.3a1.1 1.1 0 0 0 1.1 1.1H8" />
            <path d="M9 1.75 12.85 5.6v2.65" />
            <path d="M12.1 10v4.25M9.98 12.13h4.24" />
          </svg>
        </button>
        <button id="action-new-folder" class="icon-button" type="button" title="New Folder" aria-label="New Folder">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.75 12.65V3.5a.8.8 0 0 1 .8-.8h3l1.4 1.9h5.3a.8.8 0 0 1 .8.8v2.85" />
            <path d="M1.75 12.65h6.4" />
            <path d="M12.1 10v4.25M9.98 12.13h4.24" />
          </svg>
        </button>
      </div>
    </nav>

    <section id="panel-files" role="tabpanel" aria-labelledby="tab-files">
      <main id="tree-mount" aria-label="Project files">Loading project files…</main>
    </section>

    <section id="panel-search" role="tabpanel" aria-labelledby="tab-search" hidden>
      <div id="search-controls">
        <div class="search-row">
          <button id="search-filters-toggle" class="chevron-button" type="button" title="Toggle Search Details" aria-expanded="false" aria-controls="search-filters">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3.5 10.5 8 6 12.5" />
            </svg>
          </button>
          <div class="search-input-wrap">
            <input id="search-query" type="text" placeholder="Search" aria-label="Search in files" spellcheck="false" autocomplete="off" />
            <button id="search-case" class="toggle-button" type="button" title="Match Case" aria-label="Match Case" aria-pressed="false">Aa</button>
            <button id="search-word" class="toggle-button" type="button" title="Match Whole Word" aria-label="Match Whole Word" aria-pressed="false">ab</button>
          </div>
        </div>
        <div id="search-filters" hidden>
          <input id="search-include" type="text" placeholder="files to include" aria-label="Files to include" spellcheck="false" autocomplete="off" />
          <input id="search-exclude" type="text" placeholder="files to exclude" aria-label="Files to exclude" spellcheck="false" autocomplete="off" />
        </div>
      </div>
      <div id="search-summary" role="status" aria-live="polite"></div>
      <div id="search-results" aria-label="Search results"></div>
    </section>

    <div id="tree-status" role="status" aria-live="polite">Select a file to open it</div>
    <div id="dialog-root"></div>
    <script src="./tree.js"></script>
  </body>
</html>
